# Safety net for the migrate-beta.yml shadow-branch dance.
#
# That workflow deletes its shadow branch under `if: always()`, which
# covers success + step-failure. It does NOT cover the case where the
# workflow is cancelled mid-run (someone hits the cancel button in the
# Actions UI, the runner crashes, or the concurrency policy pre-empts
# it). In those cases the branch leaks.
#
# Neon has a per-project branch cap. Leaked shadow branches would
# eventually block future migrate runs and cost a small amount of
# active-compute time until Neon's own idle-suspend kicks in.
#
# This workflow runs hourly, lists every branch on the project, and
# deletes any whose name starts with `shadow-migrate-` and was created
# more than an hour ago. The 1h grace window is a large safety margin
# for the migrate workflow's own 20-minute step budget.

name: Cleanup shadow migration branches

on:
  schedule:
    # Every hour, at :17 past — offset from the top of the hour so we
    # never collide with a busy cron minute.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log candidates without deleting"
        type: boolean
        default: false

concurrency:
  group: cleanup-shadow-branches
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Load Neon creds from SSM
        run: |
          set -euo pipefail
          NEON_KEY=$(aws ssm get-parameter --name /eazyserv/beta/NEON_API_KEY \
            --with-decryption --query 'Parameter.Value' --output text)
          NEON_PROJECT=$(aws ssm get-parameter --name /eazyserv/beta/NEON_PROJECT_ID \
            --query 'Parameter.Value' --output text)
          echo "::add-mask::$NEON_KEY"
          {
            echo "NEON_API_KEY=$NEON_KEY"
            echo "NEON_PROJECT_ID=$NEON_PROJECT"
          } >> "$GITHUB_ENV"

      - name: Delete shadow-migrate branches older than 1h
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          NOW=$(date +%s)
          CUTOFF=$((NOW - 3600))
          echo "Listing branches on project $NEON_PROJECT_ID"
          BRANCHES=$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches")
          # Pull (id, name, created_at_epoch) tuples for anything matching
          # our shadow-migrate prefix. jq's fromdateiso8601 handles the
          # `2026-08-20T05:37:07Z` shape the Neon API returns.
          CANDIDATES=$(echo "$BRANCHES" | jq -r \
            '.branches[]
             | select(.name | startswith("shadow-migrate-"))
             | [.id, .name, (.created_at | fromdateiso8601)]
             | @tsv')
          if [ -z "$CANDIDATES" ]; then
            echo "No shadow-migrate-* branches present."
            exit 0
          fi
          FOUND=0
          DELETED=0
          while IFS=$'\t' read -r id name created; do
            FOUND=$((FOUND + 1))
            AGE=$((NOW - created))
            if [ "$created" -gt "$CUTOFF" ]; then
              echo "  keep    $name (id=$id age=${AGE}s — younger than 1h)"
              continue
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "  would   $name (id=$id age=${AGE}s) — DRY_RUN"
              continue
            fi
            echo "  delete  $name (id=$id age=${AGE}s)"
            RESP=$(curl -sS -X DELETE \
              -H "Authorization: Bearer $NEON_API_KEY" \
              "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$id")
            STATE=$(echo "$RESP" | jq -r '.branch.pending_state // "?"')
            echo "     -> $STATE"
            DELETED=$((DELETED + 1))
          done <<< "$CANDIDATES"
          echo "Summary: found=$FOUND deleted=$DELETED (dry_run=$DRY_RUN)"

# Deploy backend to beta (App Runner via ECR).
#
# Auth via GitHub OIDC → assume `eazyserv-github-deploy` IAM role.
#
# Triggers:
#   - push: main       → auto-deploy every merge.
#   - workflow_dispatch → manual bypass.
#
# Migrations: run unconditionally inside the API container at boot — see
# docker-api-entrypoint.sh. Idempotent (alembic no-ops when the schema is
# already at HEAD), so this workflow does nothing migration-specific: the
# image is built + pushed, App Runner rolls forward, and the new API
# container calls `alembic upgrade head` on start. A failed migration
# exits the entrypoint non-zero, App Runner marks the deploy failed and
# auto-rolls back — same "failed migration stops the deploy" invariant
# the runner-side alembic step provided before SVC-305.
#
# Why in-container: after SVC-305 moved RDS onto private ingress
# (5432/tcp only from the App Runner connector SG), a GitHub-hosted
# runner cannot reach beta RDS anymore. The App Runner container reaches
# it via the VPC Connector `eazyserv-beta-connector`.
#
# The `db-migrate` label check lives in ci.yml — it fails a PR that adds
# an alembic revision but forgot the label. Runtime effect is nil now
# (the container always migrates), but the label still forces the human
# to think about whether the schema change is intentional and to be
# ready if it fails.
#
# `alembic check` in ci.yml catches a *missing* migration at PR time;
# the on-boot alembic + App Runner rollback catches an *unapplied* one
# at deploy time. PR #175 previously deployed with its column missing
# from beta for ~20 hours before either gate existed.
#
# Concurrency: single group, no cancels. Two rapid merges queue.

name: Deploy backend to beta

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eazyserv-backend
  IMAGE_TAG: beta

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # Explicit deploy + wait. Auto-deploy is on for both services and
      # usually fires within seconds of the ECR push, but "the workflow
      # goes green whether the deploy actually rolled" was a real gap
      # (see the Sep-7 "worker on old code" false alarm). Now we:
      #   1. Try start-deployment on each service. If auto-deploy has
      #      already fired, App Runner returns InvalidStateException —
      #      that's fine; we fall through to polling the latest op.
      #   2. Poll each service's latest op until SUCCEEDED (green) or
      #      FAILED / ROLLBACK_* (red). Workflow reflects reality.
      # ------------------------------------------------------------------
      - name: Trigger + wait for App Runner deploys
        env:
          BACKEND_ARN: arn:aws:apprunner:ap-south-1:018272776203:service/eazyserv-backend/7f383544153d4cf799fba30ced3ae033
          WORKER_ARN: arn:aws:apprunner:ap-south-1:018272776203:service/eazyserv-worker/7b356f4c329243a5a2208c2bb8713e92
        run: |
          set -euo pipefail

          declare -A ops
          for arn in "$BACKEND_ARN" "$WORKER_ARN"; do
            svc=$(echo "$arn" | awk -F/ '{print $2}')
            echo "::group::$svc — trigger"
            sleep 5
            if op=$(aws apprunner start-deployment --service-arn "$arn" \
                     --query 'OperationId' --output text 2>&1); then
              echo "$svc: explicit start-deployment op=$op"
            else
              echo "$svc: start-deployment refused (auto-deploy in progress?)"
              echo "  reason: $op"
              op=$(aws apprunner list-operations --service-arn "$arn" \
                     --max-results 1 \
                     --query 'OperationSummaryList[0].Id' --output text)
              echo "$svc: piggy-backing on latest op=$op"
            fi
            ops[$svc]="$arn=$op"
            echo "::endgroup::"
          done

          echo "=== waiting for both deploys to finish (max ~15 min) ==="
          for svc in "${!ops[@]}"; do
            IFS='=' read -r arn op <<<"${ops[$svc]}"
            echo "::group::$svc — waiting on op $op"
            for i in $(seq 1 60); do
              status=$(aws apprunner list-operations --service-arn "$arn" \
                        --max-results 5 \
                        --query "OperationSummaryList[?Id=='$op'].Status | [0]" \
                        --output text)
              echo "$(date -u +%H:%M:%S) $svc op $op: $status"
              case "$status" in
                SUCCEEDED)         echo "$svc: green"; break ;;
                FAILED|ROLLBACK_FAILED|ROLLBACK_SUCCEEDED)
                  echo "::error::$svc deploy $status"; exit 1 ;;
              esac
              sleep 15
            done
            if [ "$status" != "SUCCEEDED" ]; then
              echo "::error::$svc deploy timed out after 15 min in status $status"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Summary
        run: |
          echo "Image:   ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:beta"
          echo "Git SHA: ${{ github.sha }}"
          echo ""
          echo "Both App Runner services confirmed RUNNING on this image."
          echo "Alembic ran on the backend container at boot (see docker-api-entrypoint.sh)."

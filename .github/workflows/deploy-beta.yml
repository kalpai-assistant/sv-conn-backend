# Deploy backend to beta (App Runner via ECR), with an optional pre-deploy
# alembic upgrade gated on the merged PR carrying the `db-migrate` label.
#
# Auth via GitHub OIDC → assume `eazyserv-github-deploy` IAM role.
#
# Triggers:
#   - push: main       → auto-deploy every merge. If the merge commit's PR
#                        has the `db-migrate` label, run migrations first.
#   - workflow_dispatch → manual bypass. Toggle `run_migration` to also run
#                         alembic upgrade head before deploying.
#
# Ordering guarantee: migrate (if requested) always completes before the
# ECR push, so App Runner never rolls new pods against an unmigrated schema.
#
# Failure guarantee: if migrate fails, the deploy step is skipped — old
# code + old schema keeps serving. Loud alert, zero silent downtime.
#
# Concurrency: single group, no cancels. Two rapid merges queue.

name: Deploy backend to beta

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_migration:
        description: "Also run 'alembic upgrade head' before deploying"
        type: boolean
        default: false

concurrency:
  group: deploy-beta
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: eazyserv-backend
  IMAGE_TAG: beta

jobs:
  # --------------------------------------------------------------------
  # Look up the PR that produced this merge commit and inspect its labels.
  # `should_migrate=true` iff the label is present (push path) OR the
  # manual toggle was set (workflow_dispatch path).
  # --------------------------------------------------------------------
  detect_label:
    runs-on: ubuntu-latest
    # BOTH scopes needed. `commits/{sha}/pulls` requires
    # `pull-requests: read` (returns PRs associated with a commit),
    # and `gh pr view` also needs `contents: read`. Without these the
    # step exits with `Resource not accessible by integration`,
    # `should_migrate` defaults to false, and a labeled PR is silently
    # deployed against an unmigrated schema — SVC-pricing (2026-08-20)
    # merged this way and the migration had to be run by hand.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_migrate: ${{ steps.check.outputs.should_migrate }}
    steps:
      - name: Determine whether to run migrations
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "workflow_dispatch: honoring run_migration=${{ inputs.run_migration }}"
            echo "should_migrate=${{ inputs.run_migration }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # push path — find the PR the merge commit came from. Squash-merges
          # produce one commit → one PR association; the API returns [] for
          # direct-to-main pushes (no PR), in which case we skip migrations.
          # NOTE: don't 2>/dev/null the gh api call — it hides permission
          # errors, and a silent-skip on failure is exactly the bug we
          # just paid for.
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR associated with ${{ github.sha }} — skipping migration."
            echo "should_migrate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(gh pr view "$PR_NUMBER" \
            --repo ${{ github.repository }} \
            --json labels --jq '[.labels[].name] | join(",")')
          echo "PR #$PR_NUMBER labels: $LABELS"
          # Comma-wrap both sides so a partial name match ("db-migrate-later")
          # doesn't false-positive.
          if echo ",$LABELS," | grep -q ',db-migrate,'; then
            echo "db-migrate label present → will run migrations."
            echo "should_migrate=true" >> "$GITHUB_OUTPUT"
          else
            echo "db-migrate label absent → skipping migration."
            echo "should_migrate=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------
  # Call the reusable migration workflow. Only fires when detect_label
  # says so. `alembic upgrade head` runs against the beta Neon DB.
  # --------------------------------------------------------------------
  migrate:
    needs: detect_label
    if: needs.detect_label.outputs.should_migrate == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/migrate-beta.yml
    with:
      direction: upgrade
      target: head

  # --------------------------------------------------------------------
  # Build the image and push to ECR. App Runner is configured with
  # auto_deployments_enabled=true so pushing :beta triggers a rolling
  # redeploy within 2-3 min.
  #
  # `if: always() && needs.migrate.result != 'failure' && ...` runs the
  # deploy when:
  #   - migrate succeeded         (result == 'success')
  #   - migrate was skipped       (result == 'skipped'; no label present)
  # and BLOCKS the deploy when:
  #   - migrate failed
  #   - migrate was cancelled
  # `always()` is needed to override GHA's default "skip if any need was
  # skipped" behaviour.
  # --------------------------------------------------------------------
  deploy:
    needs: [detect_label, migrate]
    if: |
      always()
      && needs.migrate.result != 'failure'
      && needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Migration ran: ${{ needs.detect_label.outputs.should_migrate }}"
          echo "Image pushed:  ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:beta"
          echo ""
          echo "App Runner will roll new pods in 2-3 min."

name: E2E Nightly (SC-52)

# Runs the Playwright smoke suite against staging every night at 02:00 IST
# (20:30 UTC) — off-peak, well after the CI/CD deploys stop for the day.
# Also runnable manually from the Actions tab for ad-hoc validation.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

jobs:
  smoke:
    name: staging smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (chromium only)
        # We only need chromium for future browser tests; the current suite
        # is HTTP-only via `request` and doesn't launch a browser.
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          E2E_TEST_PHONE: ${{ vars.E2E_TEST_PHONE }}
          E2E_TEST_OTP: ${{ secrets.E2E_TEST_OTP }}
        run: npm test

      - name: Upload Playwright report
        # Always upload — even on success, the HTML report is useful for
        # trend visibility.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      # Failure notification: emailing is the CI runner's default when a job
      # fails on a scheduled run (goes to the repo owner + last committer).
      # Add a Slack step here if/when a webhook lands.

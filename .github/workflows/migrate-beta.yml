# Run alembic against the beta DB (Neon), with a dry-run on a shadow
# branch first so a bad migration never touches main.
#
# Flow:
#   1. Create a Neon branch off main (`shadow-migrate-<sha>-<ts>`).
#      Copy-on-write, takes seconds, no data-copy cost.
#   2. Run `alembic upgrade head` (or the requested direction/target)
#      against the branch's endpoint. If this fails, the branch is deleted
#      and the job exits red — main is untouched.
#   3. Only on branch success: run the same command against main.
#   4. Always (success or failure): DELETE the branch to keep the project
#      tidy.
#
# Two callers:
#   - workflow_call from deploy-beta.yml (post-merge auto path — only fires
#     when the merged PR carries the `db-migrate` label).
#   - workflow_dispatch (manual — for hotfix upgrades, downgrades, or pinning
#     to a specific revision).
#
# Auth: OIDC assume-role `eazyserv-github-deploy`. Inline policy
# `ssm-read-beta-db-urls` grants GetParameter on
# `/eazyserv/beta/{DATABASE_URL,SYNC_DATABASE_URL,NEON_API_KEY,NEON_PROJECT_ID}`
# plus `kms:Decrypt` on the account SSM key. Adding a new SSM param the
# workflow reads means widening that policy too.

name: Migrate beta DB

on:
  workflow_call:
    inputs:
      direction:
        description: "upgrade or downgrade"
        type: string
        required: false
        default: upgrade
      target:
        description: "Alembic target (head, -1, or a specific revision id)"
        type: string
        required: false
        default: head
  workflow_dispatch:
    inputs:
      direction:
        description: "upgrade or downgrade"
        type: choice
        options: [upgrade, downgrade]
        default: upgrade
      target:
        description: "Alembic target (head, -1, or a specific revision id)"
        type: string
        required: true
        default: head

concurrency:
  # One migration at a time, ever. Second run waits for the first to
  # finish (or fail) rather than racing. Alembic's own advisory lock is
  # the belt on these suspenders — this keeps us out of that scenario.
  group: migrate-beta
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC assume-role
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (frozen)
        run: uv sync --frozen

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::018272776203:role/eazyserv-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      # -------- Load secrets from SSM ---------------------------------
      - name: Load DB URL + Neon creds from SSM
        id: ssm
        run: |
          set -euo pipefail
          MAIN_URL=$(aws ssm get-parameter --name /eazyserv/beta/DATABASE_URL \
            --with-decryption --query 'Parameter.Value' --output text)
          NEON_KEY=$(aws ssm get-parameter --name /eazyserv/beta/NEON_API_KEY \
            --with-decryption --query 'Parameter.Value' --output text)
          NEON_PROJECT=$(aws ssm get-parameter --name /eazyserv/beta/NEON_PROJECT_ID \
            --query 'Parameter.Value' --output text)
          # Mask secrets before they can appear anywhere in logs.
          echo "::add-mask::$MAIN_URL"
          echo "::add-mask::$NEON_KEY"
          # Persist for later steps. Project id is not secret but we route
          # it via env for consistency.
          {
            echo "MAIN_DATABASE_URL=$MAIN_URL"
            echo "NEON_API_KEY=$NEON_KEY"
            echo "NEON_PROJECT_ID=$NEON_PROJECT"
          } >> "$GITHUB_ENV"

      # -------- Create the shadow branch ------------------------------
      # Copy-on-write clone of main, seconds to create, near-zero storage.
      # If this step fails we haven't done anything — bail out cleanly.
      - name: Create shadow Neon branch
        id: branch
        run: |
          set -euo pipefail
          BRANCH_NAME="shadow-migrate-${GITHUB_SHA::7}-$(date +%s)"
          echo "Creating branch: $BRANCH_NAME"
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $NEON_API_KEY" \
            -H "Content-Type: application/json" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches" \
            -d "{\"branch\":{\"name\":\"$BRANCH_NAME\"},\"endpoints\":[{\"type\":\"read_write\"}]}")
          BRANCH_ID=$(echo "$RESP" | jq -r '.branch.id // empty')
          if [ -z "$BRANCH_ID" ]; then
            echo "::error::Neon branch create failed:"
            echo "$RESP" | jq '.'
            exit 1
          fi
          # asyncpg URL for the branch endpoint. Neon returns a psycopg2
          # form; convert to the async driver alembic env.py uses.
          BRANCH_URI=$(echo "$RESP" | jq -r '.connection_uris[0].connection_uri')
          BRANCH_ASYNC_URL=$(echo "$BRANCH_URI" \
            | sed 's|postgresql://|postgresql+asyncpg://|' \
            | sed 's|sslmode=require|ssl=require|')
          echo "::add-mask::$BRANCH_ASYNC_URL"
          {
            echo "BRANCH_ID=$BRANCH_ID"
            echo "BRANCH_NAME=$BRANCH_NAME"
            echo "BRANCH_DATABASE_URL=$BRANCH_ASYNC_URL"
          } >> "$GITHUB_ENV"
          echo "Branch id: $BRANCH_ID"

      # -------- Dry-run against the branch ----------------------------
      # If this fails, the "Delete shadow branch" step still runs (below,
      # `if: always()`) and main is left completely untouched.
      #
      # env.py reads DATABASE_URL from the process env; the previous step
      # exported BRANCH_DATABASE_URL via $GITHUB_ENV, so it's already in
      # this step's shell — we just re-export it under the name env.py
      # expects. Dummy JWT/ENCRYPTION/Razorpay values satisfy Pydantic
      # Settings' bootstrap; real secrets live in App Runner env, untouched.
      - name: Dry-run alembic ${{ inputs.direction }} ${{ inputs.target }} on shadow branch
        env:
          ENVIRONMENT: beta
          JWT_SECRET_KEY: migrate-only-not-used-for-signing
          ENCRYPTION_KEY: migrate-only-32-bytes-padding-x
          # app/config.Settings requires REDIS_URL at bootstrap even though
          # migrations never touch Redis. Dummy value; alembic won't dial it.
          REDIS_URL: "redis://localhost:6379/0"
          RAZORPAY_KEY_ID: unused
          RAZORPAY_KEY_SECRET: unused
          RAZORPAY_WEBHOOK_SECRET: unused
          RAZORPAYX_WEBHOOK_SECRET: unused
          RAZORPAYX_ACCOUNT_NUMBER: "0000000000"
        run: |
          set -euo pipefail
          export DATABASE_URL="$BRANCH_DATABASE_URL"
          echo "Dry-run against shadow branch $BRANCH_NAME"
          uv run alembic current
          uv run alembic ${{ inputs.direction }} ${{ inputs.target }}
          echo "--- after dry-run ---"
          uv run alembic current

      # -------- Real run against main ---------------------------------
      # Only runs if the dry-run passed. Same command, same driver, same
      # target — the branch is a byte-for-byte snapshot, so a green dry-run
      # is very high signal that main will accept the migration too.
      - name: Apply alembic ${{ inputs.direction }} ${{ inputs.target }} to main
        env:
          ENVIRONMENT: beta
          JWT_SECRET_KEY: migrate-only-not-used-for-signing
          ENCRYPTION_KEY: migrate-only-32-bytes-padding-x
          # app/config.Settings requires REDIS_URL at bootstrap even though
          # migrations never touch Redis. Dummy value; alembic won't dial it.
          REDIS_URL: "redis://localhost:6379/0"
          RAZORPAY_KEY_ID: unused
          RAZORPAY_KEY_SECRET: unused
          RAZORPAY_WEBHOOK_SECRET: unused
          RAZORPAYX_WEBHOOK_SECRET: unused
          RAZORPAYX_ACCOUNT_NUMBER: "0000000000"
        run: |
          set -euo pipefail
          export DATABASE_URL="$MAIN_DATABASE_URL"
          echo "Applying to main"
          uv run alembic current
          uv run alembic ${{ inputs.direction }} ${{ inputs.target }}
          echo "--- after apply ---"
          uv run alembic current

      # -------- Always clean up ---------------------------------------
      # `if: always()` so a failed dry-run OR apply still tears down the
      # shadow branch. Neon has a per-project branch limit; leaked shadow
      # branches would eventually block future runs.
      - name: Delete shadow Neon branch
        if: always() && env.BRANCH_ID != ''
        run: |
          set -euo pipefail
          echo "Deleting branch $BRANCH_ID ($BRANCH_NAME)"
          curl -sS -X DELETE \
            -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" \
            | jq -r '.branch | "state=\(.current_state)/\(.pending_state)"' || true

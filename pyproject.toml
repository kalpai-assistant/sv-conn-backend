[project]
name = "serviceconnect"
version = "1.0.0"
description = "On-demand home services marketplace backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.34,<0.35",
    "uvloop>=0.21,<0.22; sys_platform != 'win32'",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "psycopg2-binary>=2.9,<2.10",
    "geoalchemy2>=0.15,<0.16",
    "alembic>=1.14,<1.15",
    "pydantic>=2.10,<2.11",
    "pydantic-settings>=2.7,<2.8",
    "redis[hiredis]>=5.2,<5.3",
    "celery>=5.4,<5.5",
    "python-jose[cryptography]>=3.3,<3.4",
    "passlib[bcrypt]>=1.7,<1.8",
    "razorpay>=1.4,<1.5",
    "firebase-admin>=6.6,<6.7",
    "boto3>=1.36,<1.37",
    "httpx>=0.28,<0.29",
    "python-multipart>=0.0.20,<0.1",
    "cryptography>=42.0,<43.0",
    "setuptools>=75.0,<81",
    "sentry-sdk[fastapi]>=2.19,<3.0",
    "structlog>=24.4,<25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "factory-boy>=3.3,<4.0",
    "anyio>=4.7,<5.0",
    "coverage>=7.6,<8.0",
    # Ruff does both linting AND formatting. One tool replaces flake8 + black
    # + isort + pyupgrade, and it's ~100× faster.
    "ruff>=0.8,<0.9",
    # SVC-157: validates live response bodies against the OpenAPI schema
    # declared on each route. Only used in tests/test_api_contracts.py.
    "jsonschema>=4.23,<5.0",
    # Scripts/seeding: scripts/seed_pricing_from_xlsx.py reads the launch
    # pricing workbook. Runtime image doesn't need it (seed is a one-off
    # operator action, not something the API serves) so it lives here
    # instead of main deps.
    "openpyxl>=3.1,<4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "alembic/versions",  # auto-generated migration files — don't hand-format
]

[tool.ruff.lint]
# Deliberately conservative starter set — hoping to add S (bandit) + N (naming)
# once the current codebase passes cleanly.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, etc)
    "I",   # isort (import order)
    "B",   # flake8-bugbear (mutable default args, etc)
    "UP",  # pyupgrade (modernize syntax)
]
ignore = [
    "E501",  # line-too-long — the formatter handles most cases; a few
             # unbreakable strings shouldn't fail CI.
    "B008",  # do not perform function calls in argument defaults — FastAPI's
             # Depends() pattern uses this heavily; disabling it project-wide.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "F401",  # unused imports — fixtures often "leak" via test files
    "B011",  # assert False — legitimate in some tests
]
"alembic/env.py" = ["E402"]  # module-level imports after sys.path manipulation
"app/models/*" = [
    "F821",  # SQLAlchemy `Mapped["User"]` uses string forward refs that Ruff
             # can't resolve — flagging every ORM relationship isn't useful.
             # Fixable long-term with `from __future__ import annotations`.
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
